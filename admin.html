<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage — Wedding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .admin-wrap{max-width:1000px;margin:0 auto;padding:90px 20px 40px}
    .admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
    .admin-tab{padding:10px 16px;border-radius:999px;background:var(--card);border:1px solid var(--champagne);font-size:13px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
    .admin-tab.active{background:var(--burgundy);color:#fff;border-color:var(--burgundy)}
    .admin-panel{display:none;background:var(--card);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}
    .admin-panel.active{display:block}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
    .row.single{grid-template-columns:1fr}
    .field input,.field textarea,.field select{width:100%}
    .list-editor{display:grid;gap:12px;margin-bottom:12px}
    .list-item{background:var(--ivory);border-radius:var(--radius-sm);padding:14px;position:relative}
    .list-item .remove{position:absolute;top:8px;right:8px;background:var(--rose-deep);color:#fff;border-radius:50%;width:24px;height:24px;font-size:14px}
    .btn-sm{padding:8px 14px;border-radius:999px;background:var(--burgundy);color:#fff;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
    .btn-outline{background:var(--card);color:var(--burgundy);border:1px solid var(--burgundy)}
    .save-bar{position:sticky;bottom:0;background:var(--ivory);padding:14px 0;display:flex;gap:12px;justify-content:flex-end;border-top:1px solid var(--champagne);margin-top:20px}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{padding:8px;border-bottom:1px solid var(--champagne);text-align:left}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--burgundy);color:#fff;padding:12px 24px;border-radius:999px;display:none;z-index:200}
    .toast.show{display:block}
  </style>
</head>
<body>
  <nav class="nav">
    <div class="container nav-inner">
      <a class="logo" href="index.html">A & W</a>
      <div class="nav-links"><a href="index.html">View Site</a><a href="invitation.html">Invitation</a></div>
    </div>
  </nav>

  <div class="admin-wrap">
    <h2 class="section-title" style="font-size:36px">Content Manager</h2>
    <p class="section-sub">Edit wedding details. Changes save to this browser.</p>

    <div class="admin-tabs" id="tabs"></div>
    <div id="panels"></div>

    <div class="save-bar">
      <a class="btn-sm btn-outline" href="index.html" target="_blank">Preview Site</a>
      <button class="btn-sm btn-outline" id="resetBtn">Reset Defaults</button>
      <button class="btn-sm btn-outline" id="exportBtn">Export JSON</button>
      <button class="btn-sm btn-outline" id="importBtn">Import JSON</button>
      <button class="btn-sm" id="saveBtn">Save Changes</button>
    </div>
    <input type="file" id="fileInput" accept="application/json" style="display:none">
  </div>
  <div class="toast" id="toast">Saved</div>

  <script src="js/content.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
